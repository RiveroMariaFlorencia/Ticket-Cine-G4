<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Horarios</title>

    <link rel="stylesheet" href="style/horarios.css">
</head>

<body>

    <header>
    </header>

    <main>

        <h1>HORARIOS</h1>

        <section class="contenedor-horarios">

            <div class="tarjeta-pelicula">

                <div class="info-pelicula">
                    <h2>OPPENHEIMER</h2>
                    <p>Duración: 3 h</p>
                </div>

                <div class="horarios-pelicula">

                    <div class="dia">
                        <p>Hoy</p>
                        <button>16:30</button>
                    </div>

                    <div class="dia">
                        <p>Mañana</p>
                        <button>19:00</button>
                    </div>

                    <div class="dia">
                        <p>Viernes</p>
                        <button>22:15</button>
                    </div>

                </div>

            </div>

            <div class="tarjeta-pelicula">

                <div class="info-pelicula">
                    <h2>BARBIE</h2>
                    <p>Duración: 1 h 45 min</p>
                </div>

                <div class="horarios-pelicula">

                    <div class="dia">
                        <p>Hoy</p>
                        <button>17:00</button>
                    </div>

                    <div class="dia">
                        <p>Mañana</p>
                        <button>20:00</button>
                    </div>

                    <div class="dia">
                        <p>Viernes</p>
                        <button>22:30</button>
                    </div>

                </div>

            </div>

            <div class="tarjeta-pelicula">

                <div class="info-pelicula">
                    <h2>AVATAR</h2>
                    <p>Duración: 2 h 42 min</p>
                </div>

                <div class="horarios-pelicula">

                    <div class="dia">
                        <p>Hoy</p>
                        <button>15:30</button>
                    </div>

                    <div class="dia">
                        <p>Mañana</p>
                        <button>18:30</button>
                    </div>

                    <div class="dia">
                        <p>Viernes</p>
                        <button>21:30</button>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer>
        @Grupo4
    </footer>

</body>

</html>

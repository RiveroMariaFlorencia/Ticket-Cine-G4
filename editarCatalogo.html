<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Catalogo</title>
    <link rel="stylesheet" href="./style/editarCatalogo.css">
</head>
<body>
    <nav>
        <p>CINEMASTER</p>
        <p>Bienvenido @usuario</p>
    </nav>
    <div class="editar">
        <div>
            <h2>Seleccione que operacion desea realizar sobre el catalogo:</h2>
        </div>
        <div class="formulario">
            <h4>Agregar pelicula</h4>
            <label for="titulo">Titulo Original: </label>
            <input type="text" id="titulo" name="titulo"><br>
            <label for="origen">Origen: </label>
            <input type="text" id="origen" name="origen"><br>        
            <label for="genero">Genero: </label>
            <input type="text" id="genero" name="genero"><br>        
            <label for="director">Director: </label>
            <input type="text" id="director" name="director"><br>
            <label for="actores">Actores: </label>
            <input type="text" id="actores" name="atores"><br>
            <label for="calificacion">Calificacion: </label>
            <input type="text" id="calificacion" name="calificacion"><br>
            <label for="duracion">Duracion: </label>
            <input type="number" id="duracion" name="duracion"><br>
            <label for="distribuidora">Distribuidora: </label>
            <input type="text" id="distribuidora" name="distribuidora"><br>
            <label for="portada">Portada: </label>
            <input type="file" id="portada" name="portada" accept="image/*"><br>
            <label for="trailer">Trailer: </label>
            <input type="file" id="trailer" name="trailer" accept="video/*"><br>
        </div>
        <div class="eliminarPeli">
            <h4>Eliminar pelicula</h4>
            <label for="eliminar">Ingrese el titulo orginal de la pelicula que desea eliminar:</label>
            <input type="text" id="eliminar" name="eliminar"><br><br>
        </div>
        <button class="confirmar">Confirmar</button>
    </div>
    <footer>@Grupo4</footer>
</body>
</html>

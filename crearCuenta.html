<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="icon" href="./img/logo.png">
    <link rel="stylesheet" href="./style/miCuenta.css">
    <link rel="stylesheet" href="./style/footer.css">
    <script type="text/javascript" src="./script/miCuenta.js"></script>
</head>
<body>
    <div class="contenedor">
        <div class="logo">
            <img src="./img/logo.png" alt="logo" class="logo">
        </div>
        <div class="sesion">
            <h2>Registrarse</h2> <br>
            <!--form de registro-->
            <form>
                <label for="email">Email</label>
                <input type="email" id="emailRegistrarse" name="email" placeholder="email@gmail.com" required><br>
                <label for="dni">DNI</label>
                <input type="number" id="dniRegistrarse" name="dni" placeholder="Ingrese su dni" required><br>
                <label for="password">Contraseña</label>
                <input type="password" id="passwordRegistrarse" name="password" placeholder="Ingrese su contraseña" required><br>
                <label for="password">Confirme su contraseña</label>
                <input type="password" id="passwordRegistrarseConfirmacion" name="password" placeholder="Confirme su contraseña" required><br>
                <!--onclick ejecuta la función de js q valida el form de registro-->
                <button type="button" onclick="validarFormularioRegistrarse()">Registrarse</button>
            </form>
            <br>
            <!--permite volver al inicio de sesión-->
            <a href="./miCuenta.html">Ya tienes cuenta? <br> INGRESA!</a>
        </div>
    </div>
    <footer class="footer">
        <div class="footer-contenido">
            <div class="footer-marca">
                <h3>CineMaster</h3>
                <p>Tu próxima película comienza acá.</p>
            </div>
            <div class="footer-info">
                <p>Proyecto desarrollado por Grupo 4</p>
                <p>© 2026 CineMaster · Todos los derechos reservados</p>
            </div>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comprar Ticket</title>

    <link rel="stylesheet" href="style/comprarTicket.css">
</head>

<body>

    <header>
        <p>logo</p>
        <p>Bienvenido @usuario!</p>
    </header>

    <main>

        <h1>COMPRAR TICKET</h1>

        <section class="contenedor-compra">

            <div class="opcion-compra">
    <label for="pelicula">Película:</label>

    <select id="pelicula">
        <option value="oppenheimer">Oppenheimer</option>
        <option value="barbie">Barbie</option>
        <option value="avatar">Avatar</option>
    </select>
</div>

<div class="opcion-compra">
    <label for="dia">Día:</label>

    <select id="dia">
        <option value="hoy">Hoy</option>
        <option value="manana">Mañana</option>
        <option value="viernes">Viernes</option>
    </select>
</div>

<div class="opcion-compra">
    <label for="horario">Horario:</label>

    <select id="horario">
        <option value="16:30">16:30</option>
        <option value="19:00">19:00</option>
        <option value="22:15">22:15</option>
    </select>
</div>

            <h3>ENTRADAS</h3>

<div class="tipo-entrada">
    <label for="general">General:</label>

    <select id="general">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
</div>

<div class="tipo-entrada">
    <label for="menor">Menor:</label>

    <select id="menor">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
</div>

<div class="tipo-entrada">
    <label for="jubilado">Jubilado:</label>

    <select id="jubilado">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
</div>

            <p class="total">TOTAL: $12.000</p>

            <a href="pago.html" class="boton-confirmar">
                CONFIRMAR COMPRA
            </a>

        </section>

    </main>

    <footer>
        @Grupo4
    </footer>

</body>

</html>

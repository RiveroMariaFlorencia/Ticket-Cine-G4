<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="icon" href="../img/logo.png">
    <link rel="stylesheet" href="../style/miCuenta.css">
    <link rel="stylesheet" href="../style/footer.css">
    <script type="text/javascript" src="../script/miCuenta.js"></script>
</head>
<body>

    <!--contenedor prin: logo + form de inicio de sesión-->
    <div class="contenedor">
        <div class="logo">
            <img src="../img/logo.png" alt="logo" class="logo">
        </div>
        <div class="sesion">
            <h2>Iniciar Sesión</h2> <br>
            <!--Formulario de acceso-->
            <form>
                <label for="email">Email</label>
                <input type="email" id="emailIniciarSesion" name="email" placeholder="email@gmail.com" required> <br>
                <label for="password">Contraseña</label>
                <input type="password" id="passwordIniciarSesion" name="password" placeholder="Ingrese su contraseña" required><br>
                
                <!--el boton ejecuta la validacion del js-->
                <button type="button" onclick="validarFormularioIniciarSesion()">Iniciar Sesion</button>
            </form>
            <br>
            <!--acceso de registro p/usuarios sin cuenta-->
            <a href="./crearCuenta.html">No tienes cuenta? <br> CREA UNA!</a>
        </div>
    </div>
    <footer class="footer">
        <div class="footer-contenido">
            <div class="footer-marca">
                <h3>CineMaster</h3>
                <p>Tu próxima película comienza acá.</p>
            </div>
            <div class="footer-info">
                <p>Proyecto desarrollado por Grupo 4</p>
                <p>© 2026 CineMaster · Todos los derechos reservados</p>
            </div>
        </div>
    </footer>
</body>
</html>
